schema_version: 1

context:
  version: "8.1.0"

package:
  name: complexipy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/complexipy/complexipy-${{ version }}.tar.gz
  sha256: 0e52ec185e93ed3e246be71a9dfc5bf67837bca2877639945acc8403d6f8880a

build:
  number: 0
  script:
    - if: win
      then: git config --system core.longpaths true
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - complexipy = complexipy.cli:main

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - git
  host:
    - python
    - maturin >=1.9.4,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - complexipy
      pip_check: true
  - script:
      - complexipy --help

about:
  summary: An extremely fast Python library to calculate the cognitive complexity of Python files, written in Rust.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/rohaquinlop/complexipy
  documentation: https://rohaquinlop.github.io/complexipy/

extra:
  recipe-maintainers:
    - thewchan
